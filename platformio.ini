[env:m5stick-c-plus-se]
platform = espressif32@6.12.0
board = m5stick-c
framework = arduino

; Minimal SPIFFS partition scheme (required for OTA updates)
board_build.partitions = min_spiffs.csv

; Monitor settings
monitor_speed = 115200

; Library dependencies
lib_deps =
    m5stack/M5Unified@^0.1.17
    arduino-libraries/ArduinoHttpClient@^0.6.1
    bblanchon/ArduinoJson@^7.0.0
    paulstoffregen/Time@^1.6.1
    https://github.com/lucadentella/TOTP-Arduino.git
    https://github.com/rpolitex/ArduinoNvs.git
    h2zero/NimBLE-Arduino@^1.4.3

; Build flags
; The Plus SE is a StickC Plus without the IMU (ESP32-PICO-D4, AXP192, BM8563 RTC,
; 135x240 display), so M5Unified detects it at runtime as an M5StickCPlus
build_flags =
    -DARDUINO_M5STICK_C_PLUS_SE
